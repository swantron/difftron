name: Dogfood Difftron

# Runs the difftron Action (action.yml) against difftron's own changes.
# This is the real dogfood: `uses: ./` exercises the published composite Action,
# so a regression in action.yml shows up here before anyone else hits it.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dogfood:
    name: Run Difftron on Difftron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the Action can diff against the base

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Difftron delta coverage gate (self)
        uses: ./
        with:
          coverage: coverage.out
          threshold: '80'
          comment-pr: 'true'
          # Report-only for now: posts the sticky comment without blocking merges.
          # Flip to 'true' once difftron's own changed-line coverage is where you want it.
          fail-on-error: 'false'
